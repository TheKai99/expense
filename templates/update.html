<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>BUDEMAP | Update Expense</title>


    <style>

        /* =========================
           VARIABLES
        ========================== */

        :root {

            --bg-color: #FDFCFB;

            --text-main: #111111;

            --text-muted: #666666;

            --border-color: #E2E2E2;

            --accent-color: #4A5652;

            --focus-ring: rgba(74, 86, 82, 0.3);

            --font-stack:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

        }


        /* =========================
           BASE
        ========================== */

        * {
            box-sizing: border-box;
        }


        body {

            font-family: var(--font-stack);

            background-color: var(--bg-color);

            color: var(--text-main);

            margin: 0;

            padding: 0;

            line-height: 1.5;

            -webkit-font-smoothing: antialiased;

            -moz-osx-font-smoothing: grayscale;

        }


        .container {

            max-width: 900px;

            margin: 0 auto;

            padding: 0 24px;

        }


        /* =========================
           NAVBAR
        ========================== */

        .top-nav {

            border-bottom: 1px solid var(--border-color);

            padding: 18px 0;

            background: #ffffff;

        }


        .nav-inner {

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .logo {

            font-weight: 700;

            letter-spacing: -0.02em;

            font-size: 1.25rem;

            color: var(--text-main);

        }


        .logout-link {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 9px 18px;

            border: 1px solid var(--border-color);

            color: var(--text-main);

            text-decoration: none;

            font-size: 0.9rem;

            font-weight: 500;

            transition: all 0.2s ease;

        }


        .logout-link:hover {

            border-color: var(--text-main);

            background: var(--text-main);

            color: var(--bg-color);

        }


        /* =========================
           PAGE HEADER
        ========================== */

        .page-header {

            margin: 56px 0 36px;

        }


        .page-header h1 {

            font-size: 1.4rem;

            font-weight: 500;

            margin: 0 0 6px;

            letter-spacing: -0.02em;

        }


        .page-header p {

            color: var(--text-muted);

            margin: 0;

            font-size: 0.95rem;

        }


        /* =========================
           UPDATE CONTAINER
        ========================== */

        .update-section {

            background: #ffffff;

            border: 1px solid var(--border-color);

            border-radius: 4px;

            padding: 32px;

            margin-bottom: 100px;

        }


        .section-title {

            font-size: 0.72rem;

            color: var(--text-muted);

            text-transform: uppercase;

            letter-spacing: 0.1em;

            margin: 0 0 30px;

            font-weight: 600;

        }


        /* =========================
           FORM
        ========================== */

        .expense-form {

            display: flex;

            flex-direction: column;

            gap: 24px;

        }


        .form-row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 24px;

        }


        .form-group {

            display: flex;

            flex-direction: column;

            gap: 8px;

        }


        label {

            font-size: 0.85rem;

            color: var(--text-main);

            font-weight: 500;

        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 10px 14px;

            font-family: inherit;

            font-size: 0.95rem;

            background: transparent;

            border: 1px solid var(--border-color);

            border-radius: 0;

            transition: all 0.2s ease;

            color: var(--text-main);

        }


        input:focus,
        select:focus,
        textarea:focus {

            outline: none;

            border-color: var(--accent-color);

            box-shadow:
                0 0 0 2px var(--focus-ring);

        }


        textarea {

            min-height: 100px;

            resize: vertical;

        }


        input::placeholder,
        textarea::placeholder {

            color: #A0A0A0;

        }


        /* =========================
           CURRENCY INPUT
        ========================== */

        .input-prefix {

            position: relative;

            display: flex;

            align-items: center;

        }


        .input-prefix .prefix {

            position: absolute;

            left: 14px;

            color: var(--text-muted);

            font-size: 0.95rem;

        }


        .input-prefix input {

            padding-left: 28px;

        }


        /* =========================
           SELECT
        ========================== */

        select {

            appearance: none;

            background-image:
                url('data:image/svg+xml;utf8,<svg fill="none" stroke="%23111111" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>');

            background-repeat: no-repeat;

            background-position:
                right 14px center;

            background-size: 14px;

            padding-right: 40px;

            cursor: pointer;

        }


        /* =========================
           BUTTONS
        ========================== */

        .form-actions {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-top: 8px;

        }


        .btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 11px 22px;

            font-family: inherit;

            font-size: 0.85rem;

            font-weight: 500;

            cursor: pointer;

            text-decoration: none;

            transition: all 0.2s ease;

            border-radius: 0;

        }


        .btn-primary {

            background: var(--text-main);

            color: var(--bg-color);

            border: 1px solid var(--text-main);

        }


        .btn-primary:hover {

            background: #000000;

            border-color: #000000;

        }


        .btn-secondary {

            background: transparent;

            color: var(--text-main);

            border: 1px solid var(--border-color);

        }


        .btn-secondary:hover {

            border-color: var(--text-main);

            background: #ffffff;

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .container {

                padding: 0 18px;

            }


            .update-section {

                padding: 24px 20px;

            }


            .form-row {

                grid-template-columns: 1fr;

            }


            .form-actions {

                flex-direction: column;

                align-items: stretch;

            }


            .btn {

                width: 100%;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="top-nav">

        <div class="container nav-inner">

            <div class="logo">
                Budemap
            </div>


            <a
                href="{% url 'logout_page' %}"
                class="logout-link">

                Logout

            </a>

        </div>

    </nav>



    <main class="container">


        <!-- =========================
             PAGE HEADER
        ========================== -->

        <header class="page-header">

            <h1>
                Update expense
            </h1>

            <p>
                Make changes to your expense details.
            </p>

        </header>



        <!-- =========================
             UPDATE FORM
        ========================== -->

        <section class="update-section">


            <h2 class="section-title">
                Expense Details
            </h2>


            <form
                action=""
                method="post"
                class="expense-form">

                {% csrf_token %}



                <!-- Amount + Category -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="amount">
                            Amount
                        </label>


                        <div class="input-prefix">

                            <span class="prefix">
                                ₹
                            </span>


                            <input
                                value="{{ queryset.amount }}"
                                type="number"
                                id="amount"
                                name="amount"
                                step="0.01"
                                required>

                        </div>

                    </div>



                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>


                        <select
                            name="category"
                            id="category"
                            required>


                            <option
                                value=""
                                disabled>

                                Choose Category

                            </option>


                            <option
                                value="Food"
                                {% if queryset.category == "Food" %}
                                    selected
                                {% endif %}>

                                Food

                            </option>


                            <option
                                value="Travel"
                                {% if queryset.category == "Travel" %}
                                    selected
                                {% endif %}>

                                Travel

                            </option>


                            <option
                                value="Stationary"
                                {% if queryset.category == "Stationary" %}
                                    selected
                                {% endif %}>

                                Stationary

                            </option>


                            <option
                                value="Shopping"
                                {% if queryset.category == "Shopping" %}
                                    selected
                                {% endif %}>

                                Shopping

                            </option>


                            <option
                                value="Healthcare"
                                {% if queryset.category == "Healthcare" %}
                                    selected
                                {% endif %}>

                                Healthcare

                            </option>


                            <option
                                value="Personal Care"
                                {% if queryset.category == "Personal Care" %}
                                    selected
                                {% endif %}>

                                Personal Care

                            </option>


                            <option
                                value="Fitness"
                                {% if queryset.category == "Fitness" %}
                                    selected
                                {% endif %}>

                                Fitness

                            </option>


                        </select>

                    </div>

                </div>



                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>


                    <textarea
                        name="description"
                        id="description"
                        placeholder="Describe this expense..."
                        required>{{ queryset.description }}</textarea>

                </div>



                <!-- Actions -->

                <div class="form-actions">


                    <button
                        type="submit"
                        class="btn btn-primary">

                        Update Expense

                    </button>


                    <a
                        href="{% url 'home' %}"
                        class="btn btn-secondary">

                        Cancel

                    </a>


                </div>


            </form>

        </section>


    </main>


</body>

</html>
